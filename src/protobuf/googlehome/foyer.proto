syntax = "proto3";

// Foyer wire definitions used by the plugin. Omitted fields remain skippable.
// Preserve existing field numbers when extending this runtime subset.

import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

package google.internal.home.foyer.v1;

// Client context shared by Foyer headers and camera history requests.
message ClientEnvironment {
  message AndroidClientInfo {
    string appReleaseVersion = 2;
  }

  message IosClientInfo {}

  int32 platform = 1;
  oneof clientInfo {
    ClientEnvironment.AndroidClientInfo androidClientInfo = 2;
    ClientEnvironment.IosClientInfo iosClientInfo = 3;
  }
}

// Discovery retains device identities, room membership and structure traits.
message Home {
  message Trait {
    string name = 1;
    map<string, google.protobuf.Value> fields = 2;
  }

  string uuid = 1;
  string name = 2;
  Address address = 3;
  repeated Room rooms = 6;
  repeated Device devices = 7;
  repeated Home.Trait traits = 21;
}

message Address {
  message Coordinates {
    double latitude = 1;
    double longitude = 2;
  }

  message AddressComponents {
    string state = 3;
    string city = 5;
  }

  Address.Coordinates coordinates = 2;
  string timezone = 6;
  Address.AddressComponents addressComponents = 7;
}

message Room {
  string uuid = 1;
  string name = 3;
  repeated Device devices = 5;
}

message Device {
  message Hardware {
    string manufacturer = 1;
    string model = 2;
    string softwareVersion = 4;
  }

  message Names {
    string nameFromGoogleHome = 1;
    string name = 2;
    repeated string defaultNames = 3;
    repeated string nicknames = 4;
  }

  message Id {
    string googleUuid = 1;
    Device.ThirdPartyId thirdPartyId = 2;
  }

  message ThirdPartyId {
    string idType = 1;
    string id = 2;
  }

  message OtherThirdPartyIds {
    repeated Device.ThirdPartyId otherThirdPartyId = 1;
  }

  Device.Id id = 1;
  string displayName = 4;
  string type = 6;
  repeated string traits = 7;
  Device.Hardware hardware = 17;
  Device.Names names = 18;
  google.protobuf.Struct attributes = 20;
  Device.OtherThirdPartyIds otherIds = 39;
  Device.Id parentDevice = 57;
}

// Hidden device types requested during discovery, including Protect and Heat Link.
message GetHomeGraphRequest {
  enum DefaultHiddenDeviceType {
    DEVICE_TYPE_UNKNOWN = 0;
    DEVICE_TYPE_TOPAZ = 1;
    DEVICE_TYPE_KRYPTONITE = 2;
    DEVICE_TYPE_ANTIGUA = 3;
    DEVICE_TYPE_NEST_TAG = 4;
    DEVICE_TYPE_NEST_HEATLINK = 5;
  }

  string requestId = 3;
  repeated GetHomeGraphRequest.DefaultHiddenDeviceType deviceTypesToUnhideArray = 10;
}

message GetHomeGraphResponse {
  repeated Home homes = 2;
  repeated Device unassignedDevices = 3;
}

message GetOutdoorWeatherInfoRequest {
  string structureId = 1;
  float latitude = 2;
  float longitude = 3;
}

// The weather accessory currently consumes outdoor temperature and conditions.
message GetOutdoorWeatherInfoResponse {
  message OutdoorWeather {
    google.protobuf.FloatValue temperatureC = 1;
    string description = 4;
  }

  GetOutdoorWeatherInfoResponse.OutdoorWeather weather = 1;
}

service StructuresService {
  rpc GetHomeGraph(GetHomeGraphRequest) returns (GetHomeGraphResponse);
  rpc GetOutdoorWeatherInfo(GetOutdoorWeatherInfoRequest) returns (GetOutdoorWeatherInfoResponse);
}

// User preferences: technical-information reads and device subscriptions.
message GetUserPreferencesRequest {
  string structureId = 1;
  repeated uint32 pageCode = 2;
  google.protobuf.StringValue uuid = 3;
  bytes field5Proto = 5; // Opaque preference context; sent empty by the client.
}

// Technical-information pages provide identity details through a recursive item tree.
message GetUserPreferencesResponse {
  message ItemRef {
    uint32 id = 2;
    google.protobuf.StringValue associatedId = 3;
  }

  message PrefsItem {
    GetUserPreferencesResponse.ItemRef itemRef = 1;
    string name = 3;
    string subtitle = 4;
    repeated GetUserPreferencesResponse.PrefsItem subitems = 6;
  }

  GetUserPreferencesResponse.PrefsItem item = 1;
}

// Subscribe discovered devices and renew the bounded server subscription.
message AppSubscriptionUpdateRequest {
  message DeviceWithTraits {
    string hgsDeviceId = 1;
  }

  message SubscriptionEntities {
    google.protobuf.Duration smartPollingInterval = 3;
    repeated AppSubscriptionUpdateRequest.DeviceWithTraits deviceWithTraitsArray = 4;
  }

  AppSubscriptionUpdateRequest.SubscriptionEntities subscriptionEntities = 3;
  google.protobuf.Duration ttl = 5;
}

message AppSubscriptionUpdateResponse {
  repeated GetTraitsResponse.DeviceState initialDeviceStatesArray = 1;
}

service UsersService {
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  rpc AppSubscriptionUpdate(AppSubscriptionUpdateRequest) returns (AppSubscriptionUpdateResponse);
}

// Home control: recursive trait reads and setting updates.
message GetTraitsRequest {
  enum RefreshReason {
    REASON_UNSPECIFIED = 0;
    REASON_FETCH_CAMERA_STREAM_TRAIT = 17;
  }

  message DeviceReference {
    string uuid = 1;
  }

  repeated GetTraitsRequest.DeviceReference deviceIds = 1;
  GetTraitsRequest.RefreshReason reason = 3;
}

// Trait reads and push updates share recursive scalar, object and array values.
message GetTraitsResponse {
  message ScalarValue {
    oneof kind {
      int32 nullValue = 1;
      double number = 2;
      string text = 3;
      bool boolean = 4;
      GetTraitsResponse.Properties properties = 5;
      GetTraitsResponse.PropertyArray array = 6;
    }
  }

  message Properties {
    repeated GetTraitsResponse.Property properties = 1;
  }

  message PropertyArray {
    repeated GetTraitsResponse.ScalarValue values = 1;
  }

  message Property {
    string name = 1;
    GetTraitsResponse.ScalarValue value = 2;
  }

  message Category {
    string name = 1;
    repeated GetTraitsResponse.Property traits = 2;
    GetTraitsResponse.Properties attributes = 3;
  }

  message DeviceState {
    google.protobuf.StringValue uuid = 1;
    repeated GetTraitsResponse.Category category = 2;
  }

  repeated GetTraitsResponse.DeviceState device = 1;
}

message UpdateTraitsRequest {
  message TargetDevice {
    message InternalId {
      string source = 1;
    }

    string uuid = 1;
    UpdateTraitsRequest.TargetDevice.InternalId internalId = 2;
  }

  message Request {
    UpdateTraitsRequest.TargetDevice deviceId = 1;
    repeated GetTraitsResponse.Category categories = 2;
  }

  repeated UpdateTraitsRequest.Request request = 1;
}

message UpdateTraitsResponse {
  repeated GetTraitsResponse.DeviceState device = 1;
}

service HomeControlService {
  rpc GetTraits(GetTraitsRequest) returns (GetTraitsResponse);
  rpc UpdateTraits(UpdateTraitsRequest) returns (UpdateTraitsResponse);
}

// Energy controls use Celsius values and an explicit iOS actor where supported.
enum ThermostatMode {
  THERMOSTAT_MODE_UNSPECIFIED = 0;
  THERMOSTAT_MODE_HEAT = 1;
  THERMOSTAT_MODE_COOL = 2;
  THERMOSTAT_MODE_RANGE = 3;
  THERMOSTAT_MODE_OFF = 4;
  THERMOSTAT_MODE_ECO = 5;
}

message UpdateThermostatModeRequest {
  string deviceId = 1;
  ThermostatMode mode = 2;
  ThermostatHvacActor hvacActor = 3;
}

message UpdateThermostatModeResponse {}

message UpdateTargetTemperatureRequest {
  string deviceId = 1;
  ThermostatMode mode = 2;
  google.protobuf.FloatValue temperature = 3;
  ThermostatHvacActor hvacActor = 4;
}

message UpdateTargetTemperatureResponse {}

message UpdateTargetTemperatureRangeRequest {
  string deviceId = 1;
  google.protobuf.FloatValue tempLow = 2;
  google.protobuf.FloatValue tempHigh = 3;
  ThermostatHvacActor hvacActor = 4;
}

message UpdateTargetTemperatureRangeResponse {}

message UpdateThermostatFanModeRequest {
  string deviceId = 1;
  google.protobuf.UInt32Value runTimeSeconds = 2;
}

message UpdateThermostatFanModeResponse {}

enum ThermostatHvacActor {
  HVAC_ACTOR_UNSPECIFIED = 0;
  HVAC_ACTOR_IOS = 7;
}

message UpdateHotWaterBoostRequest {
  string deviceId = 1;
  google.protobuf.Duration duration = 2;
}

message UpdateHotWaterBoostResponse {}

service EnergyService {
  rpc UpdateThermostatMode(UpdateThermostatModeRequest) returns (UpdateThermostatModeResponse);
  rpc UpdateTargetTemperature(UpdateTargetTemperatureRequest) returns (UpdateTargetTemperatureResponse);
  rpc UpdateTargetTemperatureRange(UpdateTargetTemperatureRangeRequest) returns (UpdateTargetTemperatureRangeResponse);
  rpc UpdateThermostatFanMode(UpdateThermostatFanModeRequest) returns (UpdateThermostatFanModeResponse);
  rpc UpdateHotWaterBoost(UpdateHotWaterBoostRequest) returns (UpdateHotWaterBoostResponse);
}

// Camera streaming, talkback, power and event-session reads.
message SendCameraViewIntentRequest {
  enum ViewIntentCommand {
    VIEW_INTENT_UNSPECIFIED = 0;
    VIEW_INTENT_START = 1;
  }

  message ViewIntentRequest {
    google.protobuf.StringValue googleDeviceId = 1;
    SendCameraViewIntentRequest.ViewIntentCommand command = 2;
  }

  SendCameraViewIntentRequest.ViewIntentRequest request = 1;
}

message SendCameraViewIntentResponse {}

message JoinStreamRequest {
  enum JoinStreamRequest_StreamContext {
    STREAM_CONTEXT_UNSPECIFIED = 0;
    STREAM_CONTEXT_DEFAULT = 1;
    STREAM_CONTEXT_SETUP = 2;
  }

  enum JoinStreamRequest_EndStreamReason {
    REASON_UNSPECIFIED = 0;
    REASON_UNKNOWN = 1;
    REASON_USER_EXITED_SESSION = 2;
    REASON_VIDEO_TIME_OUT = 3;
    REASON_AUDIO_TIME_OUT = 4;
    REASON_NETWORK_FAILURE = 5;
    REASON_INCOMPATIBLE_VIDEO_CODEC = 6;
    REASON_AUDIO_ENCODE_ERROR = 7;
    REASON_AUDIO_DECODE_ERROR = 8;
  }

  enum JoinStreamRequest_VideoResolution {
    VIDEO_RESOLUTION_UNSPECIFIED = 0;
    VIDEO_RESOLUTION_STANDARD = 1;
    VIDEO_RESOLUTION_FULL_HIGH = 2;
  }

  string sdp = 1;
  string deviceId = 2;
  string command = 3;
  string streamId = 4;
  bool local = 5;
  JoinStreamRequest.JoinStreamRequest_StreamContext streamContext = 6;
  JoinStreamRequest.JoinStreamRequest_EndStreamReason endStreamReason = 7;
  JoinStreamRequest.JoinStreamRequest_VideoResolution requestedVideoResolution = 8;
}

message JoinStreamResponse {
  enum StreamTerminationStatus {
    STATUS_UNSPECIFIED = 0;
    STATUS_STREAM_TERMINATED = 1;
    STATUS_STREAM_NOT_TERMINATED = 2;
  }

  enum StreamExtensionStatus {
    STATUS_UNSPECIFIED = 0;
    STATUS_STREAM_EXTENDED = 1;
    STATUS_STREAM_NOT_EXTENDED = 2;
  }

  string sdp = 1;
  string responseType = 2;
  string streamId = 3;
  JoinStreamResponse.StreamTerminationStatus streamTerminationStatus = 4;
  JoinStreamResponse.StreamExtensionStatus streamExtensionStatus = 5;
}

message SendTalkbackRequest {
  enum TalkbackCommand {
    COMMAND_UNSPECIFIED = 0;
    COMMAND_START = 1;
    COMMAND_STOP = 2;
  }

  google.protobuf.StringValue googleDeviceId = 1;
  string streamId = 2;
  SendTalkbackRequest.TalkbackCommand command = 3;
}

message SendTalkbackResponse {
  int32 status = 1; // Response values have no established interpretation here.
}

// Detection labels are interpreted dynamically by the camera event mapper.
enum CameraEventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_MOTION = 1;
  EVENT_TYPE_SOUND = 2;
  EVENT_TYPE_PERSON = 3;
  EVENT_TYPE_FACE_FAMILIAR = 4;
  EVENT_TYPE_FACE_UNFAMILIAR = 5;
  EVENT_TYPE_PERSON_TALKING = 6;
  EVENT_TYPE_DOG_BARKING = 7;
  EVENT_TYPE_DOORBELL = 8;
  EVENT_TYPE_PACKAGE_DELIVERED = 9;
  EVENT_TYPE_PACKAGE_RETRIEVED = 10;
  EVENT_TYPE_SMOKE_ALARM = 11;
  EVENT_TYPE_CO_ALARM = 12;
  EVENT_TYPE_FIRE_ALARM = 13;
  EVENT_TYPE_GLASS_BREAK = 14;
  EVENT_TYPE_OFFLINE = 15;
  EVENT_TYPE_BABY_CRYING = 16;
  EVENT_TYPE_DOOR_KNOCK = 17;
  EVENT_TYPE_MOVING_VEHICLE = 18;
  EVENT_TYPE_FACE = 19;
  EVENT_TYPE_PACKAGE_IN_TRANSIT = 20;
  EVENT_TYPE_ANIMAL_DOG = 21;
  EVENT_TYPE_ANIMAL_CAT = 22;
  EVENT_TYPE_ANIMAL_OTHER = 23;
  EVENT_TYPE_MAGIC_MOMENT = 24;
  EVENT_TYPE_CTD = 25;
  EVENT_TYPE_CMDT = 26;
  EVENT_TYPE_TALKBACK = 27;
  EVENT_TYPE_SECURITY_ALARM = 28;
  EVENT_TYPE_NOT_A_FACE = 29;
  EVENT_TYPE_DOOR_OPEN = 30;
  EVENT_TYPE_DOOR_CLOSE = 31;
  EVENT_TYPE_DOOR_AJAR = 32;
}

message CameraActivityZone {
  string zoneId = 1;
}

message CameraEventTrack {
  string trackId = 1;
  google.protobuf.Timestamp startTime = 2;
  google.protobuf.Timestamp endTime = 3;
  repeated CameraEventType eventTypes = 4;
  repeated CameraActivityZone activityZones = 6;
}

// Sessions can expand after publication; tracks supply detection timestamps.
message CameraSession {
  string sessionId = 1;
  repeated CameraEventTrack tracks = 6;
}

// BoolValue preserves an explicit disabled camera setting.
message CameraProperties {
  google.protobuf.BoolValue streamingEnabled = 1;
}

message UpdateCameraPropertyRequest {
  string hgsDeviceId = 1;
  CameraProperties properties = 3;
}

message UpdateCameraPropertyResponse {}

// Camera timelines include detection sessions in each period variant.
message TimelineRequestWindow {
  string deviceId = 1;
  google.protobuf.Timestamp startTime = 2;
  google.protobuf.Timestamp endTime = 3;
  string pageToken = 4;
}
message ListTimelinePeriodsRequest {
  TimelineRequestWindow request = 1;
  int32 field2 = 2; // Timeline request selector; the established value is 1.
  bool strongRead = 3;
}
message RecordedTimelinePeriod {
  CameraSession session = 1;
}
message NoVideoTimelinePeriod {
  CameraSession session = 4;
}
message UnknownTimelinePeriod {
  CameraSession session = 4;
}
message TimelinePeriod {
  google.protobuf.Timestamp startTime = 1;
  google.protobuf.Timestamp endTime = 2;
  oneof details {
    RecordedTimelinePeriod recorded = 3;
    NoVideoTimelinePeriod noVideo = 4;
    UnknownTimelinePeriod unknown = 5;
  }
}
message ListTimelinePeriodsResponse {
  TimelineRequestWindow response = 1;
  repeated TimelinePeriod periods = 2;
}

service CameraService {
  rpc UpdateCameraProperty(UpdateCameraPropertyRequest) returns (UpdateCameraPropertyResponse);
  rpc ListTimelinePeriods(ListTimelinePeriodsRequest) returns (ListTimelinePeriodsResponse);
  rpc SendCameraViewIntent(SendCameraViewIntentRequest) returns (SendCameraViewIntentResponse);
  rpc JoinStream(JoinStreamRequest) returns (JoinStreamResponse);
  rpc SendTalkback(SendTalkbackRequest) returns (SendTalkbackResponse);
}

// Short-lived credential for legacy camera image downloads.
message GetOliveTokenRequest {}

message GetOliveTokenResponse {
  message Token {
    string token = 1;
    google.protobuf.Duration validity = 2;
  }

  GetOliveTokenResponse.Token response = 1;
}

service ClientOliveTokenService {
  rpc GetOliveToken(GetOliveTokenRequest) returns (GetOliveTokenResponse);
}

// Generic trait updates and explicit invalidations are the events currently consumed.
message RealtimeMessage {
  message Event {
    GetTraitsResponse.DeviceState deviceStateUpdatedEvent = 1;
    GetTraitsResponse.DeviceState deviceState = 2;
    // Presence distinguishes an empty invalidation from an absent event.
    optional bytes refreshDeviceState = 3;
    // Presence distinguishes an empty invalidation from an absent event.
    optional bytes refreshHomeGraph = 6;
  }

  RealtimeMessage.Event event = 1;
}
