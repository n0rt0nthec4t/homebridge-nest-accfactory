name: Media regression tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Download the pinned Linux x64 binary directly: the npm installer can exit successfully without installing it.
      - name: Install Homebridge FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/media-ffmpeg"
          curl --fail --location --show-error --retry 2 --connect-timeout 30 --max-time 180 \
            https://github.com/homebridge/ffmpeg-for-homebridge/releases/download/v2.2.2/ffmpeg-alpine-x86_64.tar.gz \
            --output "$RUNNER_TEMP/media-ffmpeg/ffmpeg.tar.gz"
          tar -xzf "$RUNNER_TEMP/media-ffmpeg/ffmpeg.tar.gz" -C "$RUNNER_TEMP/media-ffmpeg" \
            --strip-components=4 ./usr/local/bin/ffmpeg
          chmod +x "$RUNNER_TEMP/media-ffmpeg/ffmpeg"
      # A failed install must fail this job rather than turn its cases into skips.
      - name: Verify media binary
        run: '"$RUNNER_TEMP/media-ffmpeg/ffmpeg" -version'
      - name: Run real media regressions
        run: FFMPEG_TEST_BINARY="$RUNNER_TEMP/media-ffmpeg/ffmpeg" node --test test/rtpmuxer-media.test.js
